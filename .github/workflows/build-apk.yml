name: Build Android APK on Every Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Android with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find and Stage APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/SuppleTrack-Release-debug.apk \;
          ls -la build-output/

      - name: Upload APK as GitHub Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuppleTrack-Android-APK
          path: build-output/*.apk
          retention-days: 30
