name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK and Accept Licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK root is: $SDK_ROOT"

          # Dynamically locate sdkmanager across possible runner paths
          SDKMANAGER=""
          for p in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/13.0/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "$(which sdkmanager 2>/dev/null || true)"; do
            if [ -n "$p" ] && [ -x "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager at: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not found in known paths, continuing with Gradle auto-download"
          fi

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuppleTrack-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

