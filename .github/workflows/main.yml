name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true
          fi

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare Deterministic Android Signing Keystore
        working-directory: android/app
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring deterministic debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage Standalone APK (Flat, No Nested Folders)
        run: |
          mkdir -p output-apk
          # Stage the apk cleanly as a single standalone file SuppleTrack.apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "android/app/build/outputs/apk/debug/app-debug.apk" "output-apk/SuppleTrack.apk"
          else
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} "output-apk/SuppleTrack.apk" \;
          fi
          ls -lh output-apk/

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuppleTrack-APK
          path: output-apk/SuppleTrack.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Standalone APK (No Zip) to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "SuppleTrack Latest Standalone APK"
          body: |
            ### Direct Android APK Download (No Zip)
            Download the raw **SuppleTrack.apk** below directly to your phone. It installs immediately with 1 tap.
            
            - **App Name:** SuppleTrack
            - **Package ID:** `com.suppletrack.app`
            
            > **If you see "package conflicts with an existing package":**
            > Simply uninstall the older version from your phone once to clear the previous temporary signature. All future updates will then update smoothly in place without uninstalling!
          files: output-apk/SuppleTrack.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
