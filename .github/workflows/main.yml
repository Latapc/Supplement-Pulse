name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ndk-version: 25.1.8937393
          cmake-version: 3.22.1
          accept-android-sdk-licenses: true

      - name: Install Android platform/build-tools
        shell: bash
        run: |
          echo "$ANDROID_HOME"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --update || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "extras;google;google_play_services" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1" \
            --verbose

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate Generated APK
        id: find_apk
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} output-apk/SuppleTrack-debug.apk \;
          ls -la output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuppleTrack-Android-APK
          path: output-apk/*.apk
          retention-days: 30
