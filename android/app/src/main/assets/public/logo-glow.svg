<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect 
    x="184" 
    y="104" 
    width="144" 
    height="304" 
    rx="72" 
    fill="none" 
    stroke="#00fca8" 
    stroke-width="32" 
    opacity="0.45"
    filter="url(#neonGlow)"
  />
  <line 
    x1="184" 
    y1="256" 
    x2="328" 
    y2="256" 
    stroke="#00fca8" 
    stroke-width="32" 
    opacity="0.45"
    filter="url(#neonGlow)"
  />

  <!-- Crisp Capsule Body -->
  <rect 
    x="184" 
    y="104" 
    width="144" 
    height="304" 
    rx="72" 
    fill="#00fca8" 
    fill-opacity="0.08"
    stroke="#00fca8" 
    stroke-width="22" 
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Crisp Middle Divider Line -->
  <line 
    x1="184" 
    y1="256" 
    x2="328" 
    y2="256" 
    stroke="#00fca8" 
    stroke-width="22" 
    stroke-linecap="round"
  />
  
  <line 
    x1="196" 
    y1="256" 
    x2="316" 
    y2="256" 
    stroke="#a3ffe0" 
    stroke-width="7" 
    stroke-linecap="round"
  />
</svg>
