<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- 45-degree rotated capsule -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Top half: White capsule cap -->
    <path d="M 216 140 C 216 95, 296 95, 296 140 L 296 256 L 216 256 Z" fill="#ffffff" />
    <!-- Bottom half: Amber capsule cap -->
    <path d="M 216 256 L 296 256 L 296 372 C 296 417, 216 417, 216 372 Z" fill="#f59e0b" />
    <!-- Center divider band -->
    <line x1="216" y1="256" x2="296" y2="256" stroke="#d97706" stroke-width="4" />
  </g>
  <!-- Sparkles -->
  <circle cx="160" cy="160" r="14" fill="#fbbf24" opacity="0.9" />
  <circle cx="360" cy="340" r="10" fill="#a7f3d0" opacity="0.8" />
  <path d="M 370 140 L 375 155 L 390 160 L 375 165 L 370 180 L 365 165 L 350 160 L 365 155 Z" fill="#ffffff" />
</svg>
