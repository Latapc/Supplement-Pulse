<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Squircle -->
    <radialGradient id="squircleGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3c3d42" />
      <stop offset="60%" stop-color="#242529" />
      <stop offset="100%" stop-color="#151618" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur1"/>
      <feGaussianBlur stdDeviation="14" result="coloredBlur2"/>
      <feGaussianBlur stdDeviation="24" result="coloredBlur3"/>
      <feMerge>
        <feMergeNode in="coloredBlur3"/>
        <feMergeNode in="coloredBlur2"/>
        <feMergeNode in="coloredBlur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner Pill Fill -->
    <linearGradient id="pillInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2e33" />
      <stop offset="100%" stop-color="#1c1d20" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" fill="#090a0c" rx="110" />

  <!-- App Icon Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#squircleGrad)" stroke="#45474e" stroke-width="2.5" />

  <!-- Inner Pill Background -->
  <rect x="186" y="116" width="140" height="280" rx="70" fill="url(#pillInnerGrad)" />

  <!-- Neon Glowing Capsule Border -->
  <rect 
    x="186" 
    y="116" 
    width="140" 
    height="280" 
    rx="70" 
    fill="none" 
    stroke="#00fca8" 
    stroke-width="18" 
    filter="url(#neonGlow)"
  />

  <!-- Neon Glowing Horizontal Divider Line -->
  <line 
    x1="186" 
    y1="256" 
    x2="326" 
    y2="256" 
    stroke="#00fca8" 
    stroke-width="18" 
    filter="url(#neonGlow)"
  />
</svg>
