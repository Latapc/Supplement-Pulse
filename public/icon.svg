<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Squircle -->
    <radialGradient id="squircleGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3c3d44" />
      <stop offset="55%" stop-color="#222328" />
      <stop offset="100%" stop-color="#121316" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="glowBlur"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" fill="#0c0d0f" rx="120" />

  <!-- App Icon Squircle Base -->
  <rect 
    x="24" 
    y="24" 
    width="464" 
    height="464" 
    rx="110" 
    fill="url(#squircleGrad)" 
    stroke="#484a52" 
    stroke-width="4" 
  />

  <!-- Top Compartment Recessed Bevel -->
  <path 
    d="M 198 244 L 198 174 A 58 58 0 0 1 314 174 L 314 244 Z" 
    fill="#26272d" 
    stroke="#18191d" 
    stroke-width="5" 
  />

  <!-- Bottom Compartment Recessed Bevel -->
  <path 
    d="M 198 268 L 198 338 A 58 58 0 0 0 314 338 L 314 268 Z" 
    fill="#26272d" 
    stroke="#18191d" 
    stroke-width="5" 
  />

  <!-- Ambient Neon Bloom Glow (Capsule & Divider) -->
  <rect 
    x="184" 
    y="104" 
    width="144" 
    height="304" 
    rx="72" 
    fill="none" 
    stroke="#00fca8" 
    stroke-width="32" 
    opacity="0.4" 
    filter="url(#neonGlow)"
  />
  <line 
    x1="184" 
    y1="256" 
    x2="328" 
    y2="256" 
    stroke="#00fca8" 
    stroke-width="32" 
    opacity="0.4" 
    filter="url(#neonGlow)"
  />

  <!-- Solid Crisp Vibrant Neon Capsule Outer Shell -->
  <rect 
    x="184" 
    y="104" 
    width="144" 
    height="304" 
    rx="72" 
    fill="none" 
    stroke="#00fca8" 
    stroke-width="22" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Solid Crisp Horizontal Middle Divider Line (Exact Center) -->
  <line 
    x1="184" 
    y1="256" 
    x2="328" 
    y2="256" 
    stroke="#00fca8" 
    stroke-width="22" 
    stroke-linecap="round"
  />

  <!-- Luminous Inner Tube Core Highlight -->
  <line 
    x1="196" 
    y1="256" 
    x2="316" 
    y2="256" 
    stroke="#a3ffe0" 
    stroke-width="7" 
    stroke-linecap="round" 
    opacity="0.95"
  />
</svg>
